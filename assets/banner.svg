<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Card Glow -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Flow */
    @keyframes pulseParticle {
      0% { opacity: 0.2; transform: translateY(0px) scale(0.9); }
      50% { opacity: 0.8; transform: translateY(-10px) scale(1.1); }
      100% { opacity: 0.2; transform: translateY(0px) scale(0.9); }
    }

    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes cardFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    .particle { animation: pulseParticle 4s infinite ease-in-out; }
    .particle-delay-1 { animation-delay: 1.3s; }
    .particle-delay-2 { animation-delay: 2.6s; }

    .animated-flow {
      stroke-dasharray: 12, 12;
      animation: flowLine 3s linear infinite;
    }

    .floating-card-1 { animation: cardFloat 5s infinite ease-in-out; }
    .floating-card-2 { animation: cardFloat 6s infinite ease-in-out 1.5s; }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind Text & Foreground) -->

  <!-- Connected Flow Lines (Representing Database Migrations & CI/CD Pipeline) -->
  <path d="M 100 240 Q 250 280 400 240 T 700 240 T 1100 240" fill="none" stroke="#1e293b" stroke-width="4" />
  <path d="M 100 240 Q 250 280 400 240 T 700 240 T 1100 240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" class="animated-flow" />

  <!-- Floating Background Metric Badges (Low Opacity Backdrop Elements) -->
  <g class="floating-card-1" opacity="0.4">
    <rect x="80" y="45" width="180" height="50" rx="10" fill="#0f172a" stroke="url(#cardBorder)" stroke-width="1.5" />
    <text x="100" y="75" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">⚡ Schema Migration</text>
  </g>

  <g class="floating-card-2" opacity="0.4">
    <rect x="940" y="45" width="180" height="50" rx="10" fill="#0f172a" stroke="url(#cardBorder)" stroke-width="1.5" />
    <text x="960" y="75" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">🔄 GitOps &amp; CI/CD</text>
  </g>

  <!-- Glowing Nodes / Particles -->
  <circle cx="200" cy="190" r="4" fill="#38bdf8" class="particle particle-delay-1" filter="url(#glow)" />
  <circle cx="1000" cy="200" r="5" fill="#c084fc" class="particle particle-delay-2" filter="url(#glow)" />
  <circle cx="600" cy="50" r="3" fill="#818cf8" class="particle" filter="url(#glow)" />

  <!-- Database Cylinders in Background (Symbolic Decor) -->
  <g transform="translate(60, 150)" opacity="0.25">
    <ellipse cx="30" cy="10" rx="25" ry="8" fill="#38bdf8" />
    <path d="M 5 10 L 5 40 A 25 8 0 0 0 55 40 L 55 10 Z" fill="#0284c7" />
    <path d="M 5 40 A 25 8 0 0 0 55 40 L 55 70 A 25 8 0 0 0 5 70 Z" fill="#0369a1" />
  </g>

  <g transform="translate(1080, 140)" opacity="0.25">
    <ellipse cx="30" cy="10" rx="25" ry="8" fill="#818cf8" />
    <path d="M 5 10 L 5 40 A 25 8 0 0 0 55 40 L 55 10 Z" fill="#6366f1" />
    <path d="M 5 40 A 25 8 0 0 0 55 40 L 55 70 A 25 8 0 0 0 5 70 Z" fill="#4f46e5" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed High Contrast & Visibility) -->

  <!-- Main Repository Title -->
  <text x="600" y="130" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Database Change Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="500" font-size="18" letter-spacing="0.2">
    Curated SaaS Platforms, Database CI/CD, Schema Versioning &amp; Open-Source Migration Tools 🚀
  </text>

  <!-- Pill Tags Bar in Foreground Center -->
  <g transform="translate(325, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="20" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛠️ Schema Migration</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="200" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="275" y="20" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔀 Version Control &amp; GitOps</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="470" y="20" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">♾️ Database DevOps</text>
  </g>

</svg>
